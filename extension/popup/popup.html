<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <link rel="stylesheet" href="popup.css">
</head>
<body>
  <div class="header">
    <span class="logo">TM</span>
    <span class="title">TradeMinder</span>
  </div>

  <div class="section">
    <label class="label" for="apiUrl">TradeMinder server address</label>
    <input type="text" id="apiUrl" class="input" placeholder="http://127.0.0.1:5431" spellcheck="false">
    <div class="status-row"><span id="statusDot" class="status-dot"></span><span id="statusText" class="status-text">Checking…</span></div>
    <div class="hint">Signed in as the TradeMinder owner. Sign-in arrives in a later version.</div>
  </div>

  <div class="section">
    <label class="label">Stages</label>
    <label class="toggle"><input type="checkbox" id="stage1" checked> Category indicators</label>
    <label class="toggle"><input type="checkbox" id="stage2" checked> Commentary + AI summary</label>
    <label class="toggle"><input type="checkbox" id="stage3" checked> Alert-based coloring</label>
    <label class="toggle"><input type="checkbox" id="stage4" checked> Technical signal flags</label>
  </div>

  <button id="save" class="btn">Save</button>
  <div id="saved" class="saved-msg" style="display:none">✓ Saved</div>

  <script src="popup.js"></script>
</body>
</html>
